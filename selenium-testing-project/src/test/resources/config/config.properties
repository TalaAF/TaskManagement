# ========================================
# TASK MANAGER - SELENIUM TEST CONFIGURATION
# ========================================

# Application URL
# ${project.root} will be dynamically resolved to the project root directory
base.url=file://${project.root}/task-manager-web/index.html
dashboard.url=file://${project.root}/task-manager-web/dashboard.html
tasks.url=file://${project.root}/task-manager-web/tasks.html
categories.url=file://${project.root}/task-manager-web/categories.html
register.url=file://${project.root}/task-manager-web/register.html

# Browser Configuration
browser=chrome
# Options: chrome, firefox, edge
headless=false
maximize=true
window.width=1920
window.height=1080

# Test Credentials
valid.username=admin
valid.password=admin123
test.email=test@example.com

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=20
page.load.timeout=30
script.timeout=30

# Wait Intervals (in milliseconds)
polling.interval=500
short.wait=2000
medium.wait=5000
long.wait=10000

# Screenshot Configuration
screenshot.on.failure=true
screenshot.directory=test-output/screenshots

# Reporting Configuration
extent.report.name=Task Manager Automation Report
extent.report.path=test-output/ExtentReport.html
cucumber.report.path=test-output/cucumber-reports

# Logging
log.level=INFO
log.file.path=test-output/logs/automation.log

# Retry Configuration
retry.count=1

# Parallel Execution
parallel.tests=3
thread.count=3

# Test Data Paths
testdata.csv.path=src/test/resources/testdata/logindata.csv
testdata.excel.path=src/test/resources/testdata/taskdata.xlsx
testdata.json.path=src/test/resources/testdata/testdata.json

# Browser Specific Options
chrome.options=--disable-notifications,--disable-popup-blocking,--disable-extensions
firefox.options=--disable-notifications
edge.options=--disable-notifications

# Cross-Browser Testing
run.on.chrome=true
run.on.firefox=true
run.on.edge=true
