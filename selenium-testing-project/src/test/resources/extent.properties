# ExtentReports Configuration

# Report Theme - standard or dark
extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

# Document Encoding
extent.reporter.spark.out=test-output/ExtentReport.html

# Report Name
extent.reporter.spark.config=src/test/resources/extent-config.xml

# Enable Screenshots
extent.reporter.spark.base64imagesrc=true

# System Info
systeminfo.os=${os.name}
systeminfo.java=${java.version}
systeminfo.browser=Chrome, Firefox, Edge
systeminfo.environment=Local
systeminfo.tester=QA Team

# Date Format
extent.reporter.spark.timeformat=MMM dd, yyyy HH:mm:ss
