<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="main-container">
        <!-- Navigation -->
        <nav class="navbar" data-testid="navbar">
            <div class="nav-brand">
                <h2>Task Manager</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" data-testid="nav-dashboard">Dashboard</a></li>
                <li><a href="tasks.html" data-testid="nav-tasks">Tasks</a></li>
                <li><a href="categories.html" class="active" data-testid="nav-categories">Categories</a></li>
                <li><a href="#" id="logoutBtn" data-testid="nav-logout">Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="content-wrapper">
            <div class="page-header">
                <h1>Categories</h1>
                <button class="btn btn-primary" id="addCategoryBtn" data-testid="add-category-button">
                    ➕ Add New Category
                </button>
            </div>

            <!-- Categories Grid -->
            <div class="categories-grid" id="categoriesGrid" data-testid="categories-grid">
                <!-- Categories will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Category Modal -->
    <div id="categoryModal" class="modal" data-testid="category-modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Category</h2>
                <button class="modal-close" data-testid="modal-close">&times;</button>
            </div>
            <form id="categoryForm">
                <input type="hidden" id="categoryId" data-testid="category-id">

                <div class="form-group">
                    <label for="categoryName">Category Name *</label>
                    <input
                        type="text"
                        id="categoryName"
                        data-testid="category-name"
                        placeholder="Enter category name"
                        required
                    >
                    <span class="error-message" id="nameError"></span>
                </div>

                <div class="form-group">
                    <label for="categoryColor">Category Color *</label>
                    <div class="color-picker" data-testid="color-picker">
                        <input
                            type="color"
                            id="categoryColor"
                            data-testid="category-color"
                            value="#eab308"
                            required
                        >
                        <span class="color-preview" id="colorPreview">#eab308</span>
                    </div>
                    <span class="error-message" id="colorError"></span>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" data-testid="cancel-category" id="cancelCategoryBtn">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" data-testid="save-category" id="saveCategoryBtn">
                        <span class="btn-text">Save Category</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal" data-testid="delete-modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <button class="modal-close" data-testid="delete-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this category? Tasks using this category will be set to "Uncategorized".</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" data-testid="cancel-delete" id="cancelDeleteBtn">
                    Cancel
                </button>
                <button class="btn btn-danger" data-testid="confirm-delete" id="confirmDeleteBtn">
                    <span class="btn-text">Delete</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
