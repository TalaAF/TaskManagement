<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="main-container">
        <!-- Navigation -->
        <nav class="navbar" data-testid="navbar">
            <div class="nav-brand">
                <h2>Task Manager</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" data-testid="nav-dashboard">Dashboard</a></li>
                <li><a href="tasks.html" class="active" data-testid="nav-tasks">Tasks</a></li>
                <li><a href="categories.html" data-testid="nav-categories">Categories</a></li>
                <li><a href="#" id="logoutBtn" data-testid="nav-logout">Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="content-wrapper">
            <div class="page-header">
                <h1>Tasks</h1>
                <button class="btn btn-primary" id="addTaskBtn" data-testid="add-task-button">
                    ➕ Add New Task
                </button>
            </div>

            <!-- Filters and Search -->
            <div class="filters-section">
                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        data-testid="search-input"
                        placeholder="Search tasks..."
                    >
                </div>
                <div class="filter-controls">
                    <select id="statusFilter" data-testid="status-filter" class="filter-select">
                        <option value="">All Status</option>
                        <option value="Complete">Complete</option>
                        <option value="Incomplete">Incomplete</option>
                    </select>
                    <select id="priorityFilter" data-testid="priority-filter" class="filter-select">
                        <option value="">All Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <select id="categoryFilter" data-testid="category-filter" class="filter-select">
                        <option value="">All Categories</option>
                    </select>
                    <button class="btn btn-secondary" id="clearFiltersBtn" data-testid="clear-filters">
                        Clear Filters
                    </button>
                </div>
            </div>

            <!-- Tasks Table -->
            <div class="table-container">
                <table class="tasks-table" data-testid="tasks-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Priority</th>
                            <th>Due Date</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <!-- Tasks will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination" data-testid="pagination">
                <!-- Pagination buttons will be generated here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="taskModal" class="modal" data-testid="task-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Task</h2>
                <button class="modal-close" data-testid="modal-close">&times;</button>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId" data-testid="task-id">

                <div class="form-group">
                    <label for="taskTitle">Task Title *</label>
                    <input
                        type="text"
                        id="taskTitle"
                        data-testid="task-title"
                        placeholder="Enter task title"
                        required
                    >
                    <span class="error-message" id="titleError"></span>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description *</label>
                    <textarea
                        id="taskDescription"
                        data-testid="task-description"
                        placeholder="Enter task description"
                        rows="4"
                        required
                    ></textarea>
                    <span class="error-message" id="descriptionError"></span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Priority *</label>
                        <select id="taskPriority" data-testid="task-priority" required>
                            <option value="">Select Priority</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                        <span class="error-message" id="priorityError"></span>
                    </div>

                    <div class="form-group">
                        <label for="taskDueDate">Due Date *</label>
                        <input
                            type="date"
                            id="taskDueDate"
                            data-testid="task-due-date"
                            required
                        >
                        <span class="error-message" id="dueDateError"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategory">Category *</label>
                        <select id="taskCategory" data-testid="task-category" required>
                            <option value="">Select Category</option>
                        </select>
                        <span class="error-message" id="categoryError"></span>
                    </div>

                    <div class="form-group">
                        <label for="taskStatus">Status *</label>
                        <select id="taskStatus" data-testid="task-status" required>
                            <option value="Incomplete">Incomplete</option>
                            <option value="Complete">Complete</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" data-testid="cancel-task" id="cancelTaskBtn">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" data-testid="save-task" id="saveTaskBtn">
                        <span class="btn-text">Save Task</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal" data-testid="delete-modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2>Confirm Delete</h2>
                <button class="modal-close" data-testid="delete-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this task? This action cannot be undone.</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" data-testid="cancel-delete" id="cancelDeleteBtn">
                    Cancel
                </button>
                <button class="btn btn-danger" data-testid="confirm-delete" id="confirmDeleteBtn">
                    <span class="btn-text">Delete</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
